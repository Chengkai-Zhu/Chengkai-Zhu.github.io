<aside class="profile" aria-label="About Chengkai Zhu">
  <img class="portrait" src="/assets/portrait.png" width="402" height="380" alt="Chengkai Zhu by a mountain lake">
  <div class="profile-copy">
    <a class="profile-name" href="/">$name</a>
    <p class="chinese-name" lang="zh-Hans">$chinese_name</p>
    <p class="position">$role<br><span>at $affiliation</span></p>
    <div class="profile-links">
      <a class="email" href="mailto:$email">$email</a>
      <a href="$scholar_url">Google Scholar <span aria-hidden="true">↗</span></a>
      <a href="$github_url">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</aside>
