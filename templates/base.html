<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$site_url/assets/portrait.png">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="application/ld+json">$person_json</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/" aria-label="Chengkai Zhu — home">cz<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">$navigation</nav>
    </div>
  </header>
  <div class="page-shell">
    <aside class="profile" aria-label="About Chengkai Zhu">
      <img class="portrait" src="/assets/portrait.png" width="402" height="380" alt="Chengkai Zhu by a mountain lake">
      <div class="profile-copy">
        <a class="profile-name" href="/">$name</a>
        <p class="chinese-name" lang="zh-Hans">$chinese_name</p>
        <p class="position">$role<br><span>$affiliation</span></p>
        <div class="profile-links">
          <a class="email" href="mailto:$email">$email</a>
          <a href="$scholar_url">Google Scholar <span aria-hidden="true">↗</span></a>
          <a href="$github_url">GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="profile-note"><span class="quantum-mark" aria-hidden="true">|ψ⟩</span><p>Quantum information.<br>From principles to possibilities.</p></div>
    </aside>
    <main id="main" class="main-content">$content</main>
  </div>
  <footer class="site-footer"><div><span>© $year $name</span><a href="mailto:$email">Get in touch <span aria-hidden="true">↗</span></a></div></footer>
</body>
</html>
